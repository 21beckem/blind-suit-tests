<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binocular Depth VR</title>
  <style>
    body { font: 16px sans-serif; margin: 20px; }
    button { font: inherit; margin: 4px 0; padding: 6px; }
    input { font: inherit; width: 16em; max-width: 90%; }
    #status { margin: 12px 0; }
  </style>
</head>
<body>
  <label for="stream-address">Laptop stream address:</label>
  <input id="stream-address" value="127.0.0.1:5000" autocomplete="off" spellcheck="false">
  <button id="connect">Connect</button>
  <button onclick="VR.enter();">Enter VR</button>
  <div id="status">Disconnected</div>

  <script src="../vr.js"></script>
  <script>
    VR.enableConfigPopup(true);
    // Used until the laptop sends its current values over the WebSocket.
    let hudValues = {on: 0.5, off: 0,
                     actionStop: Array(5).fill(0.5),
                     actionUnknown: Array(5).fill(0)};
    try {
      const savedValues = JSON.parse(localStorage.getItem("navigationHudValues"));
      if (validHudValues(savedValues)) hudValues = savedValues;
    } catch (_) { /* The built-in values are used until the stream connects. */ }
    const streamAddress = document.getElementById("stream-address");
    const connectButton = document.getElementById("connect");
    const status = document.getElementById("status");
    try {
      streamAddress.value = localStorage.getItem("navigationStreamAddress") || streamAddress.value;
    } catch (_) { /* Storage can be unavailable in private browsing. */ }
    let socket;
    let retryTimer;
    let shouldConnect = false;
    let lastFrameMs = 0;
    let showingUnknown = false;

    function showUnknown(force = false) {
      if (showingUnknown && !force) return;
      VR.paintHUD([hudValues.actionUnknown,
                   Array(5).fill(hudValues.off), Array(5).fill(hudValues.off),
                   Array(5).fill(hudValues.on)]);
      showingUnknown = true;
      setStatus("Depth unavailable — stop and check");
    }

    function validHudValues(values) {
      return values && values.type === "hud-config" &&
        Number.isFinite(values.on) && Number.isFinite(values.off) &&
        0 <= values.off && values.off < values.on && values.on <= 1 &&
        [values.actionStop, values.actionUnknown].every(row =>
          Array.isArray(row) && row.length === 5 && row.every(v =>
            typeof v === "number" &&
            (Math.abs(v - values.off) < 0.00001 || Math.abs(v - values.on) < 0.00001)));
    }

    function validGrid(grid) {
      return Array.isArray(grid) && grid.length === 4 && grid.every(row =>
        Array.isArray(row) && row.length === 5 && row.every(v =>
          typeof v === "number" && Number.isFinite(v) &&
          (Math.abs(v - hudValues.off) < 0.00001 || Math.abs(v - hudValues.on) < 0.00001)));
    }

    function setStatus(text) {
      status.textContent = text;
    }

    function streamUrl() {
      const address = streamAddress.value.trim();
      if (!address) throw new Error("Enter the laptop stream address");
      const url = new URL(address.includes("://") ? address : `ws://${address}`);
      if (url.protocol !== "ws:" && url.protocol !== "wss:")
        throw new Error("Use a ws:// or wss:// stream address");
      if (url.username || url.password) throw new Error("Stream address must not contain credentials");
      if (!url.port) url.port = "5000";
      return url.href;
    }

    function connect() {
      if (!shouldConnect || (socket && socket.readyState <= WebSocket.OPEN)) return;
      clearTimeout(retryTimer);
      let url;
      try {
        url = streamUrl();
      } catch (error) {
        shouldConnect = false;
        connectButton.textContent = "Connect";
        setStatus(error.message);
        return;
      }
      try { localStorage.setItem("navigationStreamAddress", streamAddress.value.trim()); }
      catch (_) { /* The connection can still work without storage. */ }
      setStatus("Connecting...");
      connectButton.textContent = "Disconnect";
      let activeSocket;
      try {
        activeSocket = new WebSocket(url);
      } catch (error) {
        shouldConnect = false;
        connectButton.textContent = "Connect";
        setStatus(`Stream blocked: ${error.message}`);
        return;
      }
      socket = activeSocket;
      activeSocket.onopen = () => {
        if (socket !== activeSocket) return;
        lastFrameMs = performance.now();
        setStatus("Waiting for depth");
        connectButton.textContent = "Disconnect";
      };
      activeSocket.onmessage = (event) => {
        if (socket !== activeSocket) return;
        if (typeof event.data !== "string") return;
        try {
          const message = JSON.parse(event.data);
          if (message && message.type === "hud-config") {
            if (!validHudValues(message)) throw new Error("Invalid HUD values");
            hudValues = message;
            try { localStorage.setItem("navigationHudValues", JSON.stringify(message)); }
            catch (_) { /* A live stream does not depend on storage. */ }
            if (showingUnknown) showUnknown(true);
            return;
          }
          const grid = message;
          if (!validGrid(grid)) throw new Error("Expected a 4x5 HUD grid");
          VR.paintHUD(grid);
          lastFrameMs = performance.now();
          showingUnknown = false;
          setStatus("Receiving navigation HUD");
        } catch (error) {
          console.error("Invalid depth grid:", error);
          showUnknown();
        }
      };
      activeSocket.onerror = () => activeSocket.close();
      activeSocket.onclose = () => {
        if (socket !== activeSocket) return;
        socket = undefined;
        showUnknown();
        if (!shouldConnect) {
          setStatus("Disconnected");
          connectButton.textContent = "Connect";
        } else {
          setStatus("Stream unavailable — check address and browser local-network permission. Retrying...");
          retryTimer = setTimeout(connect, 1000);
        }
      };
    }

    function disconnect() {
      shouldConnect = false;
      clearTimeout(retryTimer);
      retryTimer = undefined;
      if (socket) socket.close();
      socket = undefined;
      showUnknown();
      setStatus("Disconnected");
      connectButton.textContent = "Connect";
    }

    connectButton.addEventListener("click", () => {
      if (shouldConnect) disconnect();
      else {
        shouldConnect = true;
        connect();
      }
    });

    shouldConnect = true;
    showUnknown();
    setInterval(() => {
      if (performance.now() - lastFrameMs > 750) showUnknown();
    }, 200);
    connect();
  </script>
</body>
</html>
